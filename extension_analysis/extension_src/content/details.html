<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8"/>
    <title>Video Download by HITIF</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

      body {
        padding: 20px;
        background: hsl(225 25% 5%);
        color: hsl(220 15% 88%);
        font-family: 'Inter', system-ui, sans-serif;
      }

      table {
        border-collapse: collapse;
        font-family: 'Inter', system-ui, sans-serif;
        letter-spacing: 0.3px;
        border: 1px solid hsl(225 30% 18%);
        border-radius: 8px;
        overflow: hidden;
        text-wrap: nowrap;
        box-shadow: 0 2px 16px hsl(0 0% 0% / 0.3);
      }

      tr.separator {
        border-top: 2px solid hsl(250 60% 40%);
      }

      th {
        background: hsl(225 24% 10%);
        color: hsl(220 15% 92%);
        font-weight: 600;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      th, td {
        min-width: 150px;
        border: 1px solid hsl(225 25% 16%);
        padding: 8px 12px;
        text-align: left;
      }

      td {
        font-family: 'DM Mono', 'SF Mono', 'Fira Code', monospace;
        font-size: 0.82rem;
        color: hsl(220 10% 78%);
      }

      tbody > tr:nth-of-type(even) {
        background-color: hsl(225 22% 8%);
      }

      tbody > tr:hover {
        background-color: hsl(250 30% 12%);
      }

    </style>
  </head>

  <body>
    <table><tbody></tbody></table>
    <script type="module" src="details.js"></script>
  </body>
</html>
